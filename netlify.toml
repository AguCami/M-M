# Configuración de Netlify para el sitio estático de Inversiones Generales M&M
# No hay build: son archivos estáticos servidos desde la raíz del repo.

[build]
  publish = "."
  command = ""

# Cache largo para los assets (imágenes, css, js, video); el HTML no se cachea fuerte.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
